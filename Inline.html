<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Elements Example</title>
</head>

<body>

    <h1>Inline Elements in HTML</h1>
    <h2>Example 1 - Image</h2>
    <img src="image1.jpg" alt="My First Image" width="200">

    <br><br>
    <h2>Example 2 - Image</h2>
    <img src="image2.jpg" alt="My Second Image" width="200"> 

    <h2>Example 1 - Anchor Link</h2>
    <p>
        Visit
        <a href="https://www.google.com" target="_blank">
            Google
        </a>
    </p>

    <h2>Example 2 - Anchor Link</h2>
    <p>
        Visit
        <a href="https://www.youtube.com" target="_blank">
            YouTube
        </a>
    </p> 

    <h2>Example 1 - Span</h2>
    <p>
        My name is
        <span>Satwik Rai</span>.
    </p>

    <h2>Example 2 - Span</h2>
    <p>
        I am learning
        <span>HTML</span>.
    </p>

</body>

</html>
